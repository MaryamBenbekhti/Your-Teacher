<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختاري المادة | معلمتك</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-content">
    <a href="index.html" class="logo">معلمتك<span>✦</span></a>
    <ul class="nav-links">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="about.html">مين أستاذة عزيزة؟</a></li>
      <li><a href="subjects.html">المواد</a></li>
      <li><a href="problems.html">المشاكل الشائعة</a></li>
      <li><a href="moms.html">آراء الأمهات</a></li>
      <li><a href="videos.html">شروحات</a></li>
      <li><a href="contact.html" class="nav-btn">احجزي جلستك الآن</a></li>
    </ul>
  </div>
</nav>

<section class="container">

  <!-- Breadcrumb -->
  <div class="hidden-load" style="margin-bottom: 30px; font-size: 0.9rem; color: #999; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <a href="videos.html" style="color:var(--accent); font-weight:700; text-decoration:none;">الشروحات</a>
    <span style="opacity:0.4;">◂</span>
    <a id="breadcrumb-back" href="grade-select.html" style="color:var(--accent); font-weight:700; text-decoration:none;">المرحلة</a>
    <span style="opacity:0.4;">◂</span>
    <span id="breadcrumb-current" style="color:var(--text-dark); font-weight:700;">اختيار المادة</span>
  </div>

  <!-- Header -->
  <div class="section-header hidden-load" style="text-align:center; margin-bottom: 10px;">
    <span class="badge" id="cat-label">📂 التصنيف</span>
    <h1 class="main-title">اختاري <span style="color:var(--accent)">المادة</span></h1>
    <p class="subtitle">اختاري المادة اللي تبغين تشوفين شروحاتها</p>
  </div>

  <!-- Subjects Grid — injected by JS -->
  <div class="subjects-grid" id="subjects-grid"></div>

</section>

<script src="script.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const cat    = params.get('cat')   || 'qudurat';
  const grade  = params.get('grade') || '';

  const catMeta = {
    qudurat: { label: '🧠 قدرات',        breadcrumb: 'قدرات' },
    tahsili: { label: '📚 تحصيلي',       breadcrumb: 'تحصيلي' },
    term1:   { label: '🍂 الترم الأول',  breadcrumb: 'الترم الأول' },
    term2:   { label: '🌸 الترم الثاني', breadcrumb: 'الترم الثاني' },
  };

  const gradeLabels = {
    'اول-ابتدائي':  'أول ابتدائي',  'ثاني-ابتدائي': 'ثاني ابتدائي',
    'ثالث-ابتدائي': 'ثالث ابتدائي', 'رابع-ابتدائي': 'رابع ابتدائي',
    'خامس-ابتدائي': 'خامس ابتدائي', 'سادس-ابتدائي': 'سادس ابتدائي',
    'اول-متوسط':    'أول متوسط',    'ثاني-متوسط':   'ثاني متوسط',
    'ثالث-متوسط':   'ثالث متوسط',   'اول-ثانوي':    'أول ثانوي',
    'ثاني-ثانوي':   'ثاني ثانوي',   'ثالث-ثانوي':   'ثالث ثانوي',
  };

  // ── SUBJECT LISTS ──────────────────────────────────────────
  // Add or remove subjects here anytime

  const elementarySubjects = [
    { key: 'math',    icon: '🔢', name: 'رياضيات',  desc: 'جمع، طرح، ضرب، قسمة وأكثر.',          theme: 'math-theme' },
    { key: 'arabic',  icon: '📖', name: 'عربي',      desc: 'قراءة، كتابة، إملاء ونحو.',            theme: 'arabic-theme' },
    { key: 'english', icon: '🌐', name: 'إنجليزي',   desc: 'أساسيات اللغة الإنجليزية.',            theme: 'english-theme' },
    { key: 'science', icon: '🌿', name: 'علوم',      desc: 'علوم الطبيعة والبيئة والجسم.',         theme: 'science-theme' },
    { key: 'social',  icon: '🗺️', name: 'اجتماعيات', desc: 'تاريخ، جغرافيا والتربية الوطنية.',     theme: 'arabic-theme' },
    { key: 'islamic', icon: '📿', name: 'إسلامية',   desc: 'قرآن، فقه وتربية إسلامية.',            theme: 'math-theme' },
  ];

  const middleHighSubjects = [
    { key: 'math',      icon: '🔢', name: 'رياضيات', desc: 'جبر، هندسة، إحصاء وحساب مثلثات.',     theme: 'math-theme' },
    { key: 'physics',   icon: '⚡', name: 'فيزياء',  desc: 'ميكانيكا، كهرباء وموجات.',             theme: 'science-theme' },
    { key: 'chemistry', icon: '🧪', name: 'كيمياء',  desc: 'عناصر، روابط وتفاعلات كيميائية.',      theme: 'arabic-theme' },
    { key: 'biology',   icon: '🔬', name: 'أحياء',   desc: 'خلايا، أنظمة ووراثة.',                 theme: 'english-theme' },
    { key: 'english',   icon: '🌐', name: 'إنجليزي', desc: 'قواعد، مفردات وقراءة وكتابة.',         theme: 'english-theme' },
  ];

  // ── DETECT STAGE ───────────────────────────────────────────
  const elementaryGrades = [
    'اول-ابتدائي','ثاني-ابتدائي','ثالث-ابتدائي',
    'رابع-ابتدائي','خامس-ابتدائي','سادس-ابتدائي'
  ];

  const isElementary = elementaryGrades.includes(grade);
  const subjectList  = isElementary ? elementarySubjects : middleHighSubjects;

  // ── UPDATE PAGE LABELS ─────────────────────────────────────
  const meta       = catMeta[cat] || catMeta['qudurat'];
  const gradeLabel = gradeLabels[grade] || grade;

  document.getElementById('cat-label').textContent        = meta.label + ' • ' + gradeLabel;
  document.getElementById('breadcrumb-current').textContent = gradeLabel;
  document.getElementById('breadcrumb-back').href         = 'grade-select.html?cat=' + cat;
  document.title = gradeLabel + ' | معلمتك';

  // ── BUILD CARDS ────────────────────────────────────────────
  const grid = document.getElementById('subjects-grid');

  subjectList.forEach(sub => {
    const a = document.createElement('a');
    a.href      = 'video-list.html?cat=' + cat + '&grade=' + grade + '&subject=' + sub.key;
    a.className = 'subject-card ' + sub.theme + ' hidden-load';
    a.style     = 'text-decoration:none; color:inherit;';
    a.innerHTML = `
      <div class="icon-box">${sub.icon}</div>
      <h3>${sub.name}</h3>
      <p>${sub.desc}</p>
      <div class="pill-tags"><span>شوفي الشروحات ←</span></div>
    `;
    grid.appendChild(a);
  });

  // Re-run scroll observer for dynamically added cards
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('show'); });
  }, { threshold: 0.1 });
  document.querySelectorAll('.hidden-load').forEach(el => observer.observe(el));
</script>
</body>
</html>
