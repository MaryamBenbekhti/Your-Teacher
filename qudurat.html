  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-content">
    <a href="index.html" class="logo">مدربتك<span>✦</span></a>
    <ul class="nav-links">
      <li><a href="index.html">الرئيسية</a></li>
      <li><a href="about.html">مين أستاذة عزيزة؟</a></li>
      <li><a href="subjects.html">المواد</a></li>
      <li><a href="problems.html">المشاكل الشائعة</a></li>
      <li><a href="moms.html">آراء الأمهات</a></li>
      <li><a href="videos.html">شروحات</a></li>
      <li><a href="contact.html" class="nav-btn">احجزي جلستك الآن</a></li>
    </ul>
  </div>
</nav>

<section class="container">

  <!-- Breadcrumb -->
  <div class="hidden-load" style="margin-bottom: 30px; font-size: 0.9rem; color: #999; display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
    <a href="videos.html" style="color:var(--accent); font-weight:700; text-decoration:none;">الشروحات</a>
    <span style="opacity:0.4;">◂</span>
    <span id="bc-current" style="color:var(--text-dark); font-weight:700;">الفيديوهات</span>
  </div>

  <!-- Header -->
  <div class="section-header hidden-load" style="text-align:center; margin-bottom: 10px;">
    <span class="badge" id="page-badge">📂</span>
    <h1 class="main-title">شروحات <span style="color:var(--accent)" id="page-title">المادة</span></h1>
    <p class="subtitle" id="page-subtitle">جميع الفيديوهات المتعلقة بهذه المادة</p>
  </div>

  <!-- Training file tiles (questions-data.js, key "qudurat") -->
  <div id="trainings"></div>

</section>

<script src="questions-data.js"></script>
<script src="training.js"></script>
<script src="script.js"></script>
<script>
  const params  = new URLSearchParams(window.location.search);
  const cat     = params.get('cat')     || 'qudurat';
  const grade   = params.get('grade')   || '';
  const subject = params.get('subject') || '';

  const catMeta = {
    qudurat: { label: '🧠 قدرات',        name: 'قدرات' },
    tahsili: { label: '📚 تحصيلي',       name: 'تحصيلي' },
    term1:   { label: '🍂 الترم الأول',  name: 'الترم الأول' },
    term2:   { label: '🌸 الترم الثاني', name: 'الترم الثاني' },
  };

  const gradeLabels = {
    'اول-ابتدائي':  'أول ابتدائي',
    'ثاني-ابتدائي': 'ثاني ابتدائي',
    'ثالث-ابتدائي': 'ثالث ابتدائي',
    'رابع-ابتدائي': 'رابع ابتدائي',
    'خامس-ابتدائي': 'خامس ابتدائي',
    'سادس-ابتدائي': 'سادس ابتدائي',
    'اول-متوسط':    'أول متوسط',
    'ثاني-متوسط':   'ثاني متوسط',
    'ثالث-متوسط':   'ثالث متوسط',
    'اول-ثانوي':    'أول ثانوي',
    'ثاني-ثانوي':   'ثاني ثانوي',
    'ثالث-ثانوي':   'ثالث ثانوي',
  };

  const subjectLabels = {
    math:      'رياضيات',
    physics:   'فيزياء',
    chemistry: 'كيمياء',
    biology:   'أحياء',
    english:   'إنجليزي',
  };

  const catLabel     = (catMeta[cat] || {}).label || cat;
  const catName      = (catMeta[cat] || {}).name  || cat;
  const gradeLabel   = gradeLabels[grade]          || grade;
  const subjectLabel = subjectLabels[subject]       || subject;

  // This page is usually opened with only ?cat=, so grade and subject are optional
  const heading  = subjectLabel || catName;
  const forGrade = gradeLabel ? ' لـ ' + gradeLabel : '';

  // Update page text
  document.getElementById('page-badge').textContent    = catLabel + (gradeLabel ? ' • ' + gradeLabel : '');
  document.getElementById('page-title').textContent    = heading;
  document.getElementById('page-subtitle').textContent = 'جميع شروحات ' + heading + forGrade;
  document.title = heading + (gradeLabel ? ' — ' + gradeLabel : '') + ' | مدربتك';

  // Breadcrumb
  document.getElementById('bc-current').textContent = heading;

  // Trainings: one 📄 tile per training, each opens its own page
  renderTrainingTiles(document.getElementById('trainings'), cat);
</script>
</body>
</html>
