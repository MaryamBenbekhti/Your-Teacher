<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>فكّر أقل، حُلّ أسرع 🧠⚡ | المساحات المظللة</title>
<style>
  :root{
    --page-bg1:#fbe9c6;
    --page-bg2:#f6d9a0;
    --teal:#1ba394;
    --teal-dark:#12786d;
    --good:#2ecc71;
    --bad:#e74c3c;
    --card-bg:#ffffff;
    --text-dark:#2b2b2b;
  }
  *{box-sizing:border-box;}
  bdi{unicode-bidi:isolate;}
  body{
    margin:0;
    font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(160deg,var(--page-bg1),var(--page-bg2));
    min-height:100vh;
    color:var(--text-dark);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px 10px 60px;
  }
  .tagline{text-align:center;font-size:1rem;color:#5a4322;opacity:.85;margin-bottom:4px;}
  h1{text-align:center;font-size:1.35rem;margin:4px 0 6px;color:#3f2f14;}
  .diff-note{text-align:center;font-size:.85rem;color:#7a5c2e;margin-bottom:14px;}

  .badges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:680px;margin-bottom:18px;}
  .badge{color:#fff;padding:8px 16px;border-radius:999px;font-size:.82rem;font-weight:700;white-space:nowrap;}

  .score-pill{
    background:#fff;color:#3f2f14;font-weight:800;padding:10px 22px;border-radius:999px;
    box-shadow:0 6px 16px rgba(0,0,0,.12);margin-bottom:22px;font-size:1.05rem;
  }

  .feed{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px;}

  .qcard{
    position:relative;background:var(--card-bg);border-radius:22px;padding:22px 18px 20px;
    box-shadow:0 10px 30px rgba(0,0,0,.10);overflow:hidden;
  }
  .qcard::before{
    content:"";position:absolute;top:0;right:0;width:70px;height:70px;
    background:rgba(27,163,148,.12);border-radius:0 0 0 100%;
  }
  .qcard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px;position:relative;z-index:1;}
  .qcard-head-right{display:flex;align-items:center;gap:10px;}
  .qnum-badge{
    background:var(--teal);color:#fff;width:32px;height:32px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0;
  }
  .qcard-title{font-weight:800;font-size:1rem;color:#333;}
  .cat-tag{background:#e6f7f4;color:var(--teal-dark);font-size:.76rem;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;}
  .diff-dot{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;margin-right:6px;white-space:nowrap;}
  .diff-easy{background:#e6f7ee;color:#1e7e42;}
  .diff-med{background:#fff4e0;color:#a56a00;}
  .diff-hard{background:#fdeaea;color:#a52a1f;}

  .qtext-box{
    border:2px dashed #dcd3bd;border-radius:16px;padding:16px 14px;text-align:center;
    font-weight:800;font-size:1.06rem;color:#2b2b2b;margin-bottom:12px;line-height:1.9;
  }
  .nudge{text-align:center;font-style:italic;color:#8a8a8a;font-size:.85rem;margin-bottom:16px;line-height:1.6;}

  .accordion{background:#fdeee0;border-radius:14px;margin-bottom:10px;overflow:hidden;}
  .accordion-head{
    display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;
    font-size:.92rem;font-weight:700;color:#5a4630;
  }
  .accordion-plus{font-size:1.1rem;font-weight:800;color:#8a6d00;flex-shrink:0;}
  .accordion-body{
    max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 16px;
    font-size:.9rem;color:#5a4630;line-height:1.9;
  }
  .accordion.open .accordion-body{max-height:320px;padding:0 16px 14px;}
  .accordion.open .accordion-plus{transform:rotate(45deg);}

  .options{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .option{
    background:#fdfcf8;border:2px solid #ece4d0;border-radius:14px;padding:14px 18px;font-size:1.02rem;
    font-weight:700;text-align:right;cursor:pointer;transition:.15s;font-family:inherit;color:#2b2b2b;
  }
  .option:hover:not(:disabled){border-color:var(--teal);}
  .option.correct{background:#e9fbf0;border-color:var(--good);color:#1e7e42;}
  .option.wrong{background:#fdecea;border-color:var(--bad);color:#a52a1f;}
  .option:disabled{cursor:default;opacity:.9;}

  .qfeedback{min-height:22px;font-weight:700;margin-top:12px;text-align:center;font-size:.92rem;}
  .qfeedback.good{color:var(--good);}
  .qfeedback.bad{color:var(--bad);}

  .result-card{
    display:none;background:var(--card-bg);border-radius:22px;padding:30px 22px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.10);
  }
  .result-card.show{display:block;}
  .result-emoji{font-size:3rem;margin-bottom:8px;}
  .result-title{font-size:1.3rem;font-weight:800;margin-bottom:6px;}
  .result-score{font-size:2.1rem;font-weight:900;color:var(--teal-dark);margin-bottom:10px;}
  .result-note{font-size:.95rem;color:#555;margin-bottom:22px;line-height:1.7;}
  .btn-row{display:flex;flex-direction:column;gap:10px;}
  .whatsapp-btn,.retry-btn{
    border:none;padding:13px 18px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;
    text-decoration:none;display:inline-block;font-family:inherit;
  }
  .whatsapp-btn{background:#25D366;color:#fff;}
  .retry-btn{background:#f1f1f1;color:#333;}
  .footer-tag{margin-top:26px;text-align:center;font-size:.85rem;color:#5a4322;opacity:.8;}
  .frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.25;font-size:.95em;}
  .frac .num{border-bottom:1.6px solid currentColor;padding:0 4px 1px;}
  .frac .den{padding:1px 4px 0;}
  sup{font-size:.7em;line-height:0;vertical-align:super;}
.fig{background:#fffdf6;border:1.5px solid #efe6d0;border-radius:16px;padding:8px;margin:0 0 12px;display:flex;justify-content:center;}
  .fig svg{width:100%;max-width:340px;height:auto;display:block;}
</style>
</head>

  <h1>تحدي المساحات المظللة</h1>

function fmt(s){
  return s
    .replace(/@\{([^{}|]*)\|([^{}|]*)\}/g,'<span class="frac"><span class="num">$1</span><span class="den">$2</span></span>')
    .replace(/\^\{([^{}]*)\}/g,'<sup>$1</sup>')
    .replace(/\{\{(.+?)\}\}/g,'<bdi dir="ltr">$1</bdi>')
    .replace(/\n/g,'<br>');

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderBadges(){
  const el = document.getElementById('badges');
  el.innerHTML = '';
  categories.forEach(c => {
    const span = document.createElement('span');
    span.className = 'badge';
    span.style.background = c.color;
    span.textContent = c.name;
    el.appendChild(span);
  });
}

const diffLabel = {easy:"سهل 🌱", med:"متوسط ⚙️", hard:"صعب 🔥"};
const diffClass = {easy:"diff-easy", med:"diff-med", hard:"diff-hard"};

function buildAccordion(title, bodyHtml){
  const acc = document.createElement('div');
  acc.className = 'accordion';
  const head = document.createElement('div');
  head.className = 'accordion-head';
  head.innerHTML = `<span>${title}</span><span class="accordion-plus">+</span>`;
  const body = document.createElement('div');
  body.className = 'accordion-body';
  body.innerHTML = bodyHtml;
  head.addEventListener('click', () => acc.classList.toggle('open'));
  acc.appendChild(head);
  acc.appendChild(body);
  return acc;
}

function buildCard(item, index){
  const card = document.createElement('div');
  card.className = 'qcard';

  const head = document.createElement('div');
  head.className = 'qcard-head';
  head.innerHTML = `
    <div>
      <span class="diff-dot ${diffClass[item.diff]}">${diffLabel[item.diff]}</span>
      <span class="cat-tag">${item.cat}</span>
    </div>
    <div class="qcard-head-right">
      <span class="qcard-title">السؤال ${index + 1}</span>
      <span class="qnum-badge">${index + 1}</span>
    </div>`;
  card.appendChild(head);

  const qBox = document.createElement('div');
  qBox.className = 'qtext-box';
  qBox.innerHTML = fmt(item.q);
  card.appendChild(qBox);

  if(item.fig){
    const f = document.createElement('div');
    f.className = 'fig';
    f.innerHTML = '<svg viewBox="0 0 240 175" role="img" aria-label="شكل توضيحي للسؤال">' + item.fig + '</svg>';
    card.appendChild(f);
  }

  const nudge = document.createElement('div');
  nudge.className = 'nudge';
  nudge.innerHTML = '🔍 ' + fmt(item.nudge) + ' 💬';
  card.appendChild(nudge);

  card.appendChild(buildAccordion('تلميح: أي قانون يُستخدم؟ 🔍', fmt(item.rule)));
  card.appendChild(buildAccordion('تلميح: كمّل الحل 🎯', fmt(item.steps)));

  const optionsBox = document.createElement('div');
  optionsBox.className = 'options';
  const pairs = shuffle(item.options.map((opt, idx) => ({text: opt, isCorrect: idx === item.correct})));

  const feedbackEl = document.createElement('div');
  feedbackEl.className = 'qfeedback';

  pairs.forEach(pair => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = fmt(pair.text);
    btn.addEventListener('click', () => {
      const allBtns = optionsBox.querySelectorAll('.option');
      if(card.dataset.answered) return;
      card.dataset.answered = 'true';
      allBtns.forEach(b => b.disabled = true);

      if(pair.isCorrect){
        btn.classList.add('correct');
        feedbackEl.textContent = '✅ إجابة صحيحة!';
        feedbackEl.className = 'qfeedback good';
        score++;
      } else {
        btn.classList.add('wrong');
        allBtns.forEach((b, i) => { if(pairs[i].isCorrect) b.classList.add('correct'); });
        feedbackEl.textContent = '❌ الإجابة الصحيحة موضّحة بالأخضر';
        feedbackEl.className = 'qfeedback bad';
      }
      document.getElementById('scoreNow').textContent = score;
      checkAllAnswered();
    });
    optionsBox.appendChild(btn);
  });

  card.appendChild(optionsBox);
  card.appendChild(feedbackEl);
  return card;
}

function renderFeed(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  questions.forEach((item, idx) => feed.appendChild(buildCard(item, idx)));
}

function checkAllAnswered(){
  const n = document.querySelectorAll('#feed .qcard[data-answered="true"]').length;
  if(n === total) showResult();
}

function showResult(){
  const resultCard = document.getElementById('resultCard');
  document.getElementById('finalScore').textContent = score;

  let emoji, note;
  if(score >= 18){ emoji='🏆'; note='ممتاز! إتقان كامل لدرس المساحات المظللة 🔥'; }
  else if(score >= 14){ emoji='🎉'; note='أداء رائع! راجع الأسئلة اللي أخطأت فيها وبتكون جاهز ١٠٠٪'; }
  else if(score >= 9){ emoji='💪'; note='بداية جيدة، تحتاج مراجعة بسيطة على بعض النقاط.'; }
  else { emoji='📘'; note='خذ وقتك في مراجعة الدرس وجرّب التحدي مرة ثانية!'; }

  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultNote').textContent = note;

  const shareText = encodeURIComponent(`جبت ${score} من ${total} في تحدي المساحات المظللة! 🧠⚡ جرب أنت كمان: ${location.href}`);
  document.getElementById('shareBtn').href = `https://wa.me/?text=${shareText}`;

  resultCard.classList.add('show');
  resultCard.scrollIntoView({behavior:'smooth', block:'center'});
}

document.getElementById('retryBtn').addEventListener('click', () => {
  score = 0;
  document.getElementById('scoreNow').textContent = 0;
  document.getElementById('resultCard').classList.remove('show');
  renderFeed();
  window.scrollTo({top:0, behavior:'smooth'});
});

renderBadges();
renderFeed();
</script>

</body>
</html>
