<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>تحدي: فكّر أقل، حُلّ أسرع 🧠⚡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Baloo+Bhaijaan+2:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EE;
    --ink:#1F2A37;
    --teal:#0E8C86;
    --teal-dark:#0A6B66;
    --coral:#FF6B5E;
    --sun:#FFC23C;
    --purple:#8E6FD1;
    --blue:#3E7CB1;
    --green:#1a9c6b;
    --pink:#D9739F;
    --brown:#A0714E;
    --card:#FFFFFF;
    --shadow: 0 10px 25px rgba(31,42,55,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,194,60,0.25), transparent 40%),
      radial-gradient(circle at 88% 18%, rgba(142,111,209,0.18), transparent 45%),
      var(--cream);
    font-family:'Cairo', sans-serif;
    color:var(--ink);
    padding:16px 12px 60px;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{text-align:center;margin-bottom:14px;}
  header .badge{
    display:inline-block;background:var(--purple);color:#fff;font-family:'Baloo Bhaijaan 2';
    font-weight:700;padding:7px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);
    transform:rotate(-2deg);
  }
  header h1{font-family:'Baloo Bhaijaan 2';font-weight:700;font-size:22px;margin:12px 0 4px;color:var(--teal-dark);}
  header p{margin:0;color:#5b6572;font-size:13.5px;}

  .legend{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px;font-size:10px;font-weight:700;}
  .legend span{padding:4px 8px;border-radius:999px;color:#fff;}

  .score-bar{
    display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 20px;
    background:var(--card);border-radius:999px;padding:8px 18px;box-shadow:var(--shadow);
    font-weight:700;font-size:14px;width:fit-content;margin-inline:auto;position:sticky;top:8px;z-index:10;
  }
  .score-bar span{color:var(--purple);}

  .card{
    background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;
    margin-bottom:22px;border:2px solid rgba(0,0,0,0.03);position:relative;overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;top:-40px;left:-40px;width:110px;height:110px;
    background:var(--accent, var(--teal));opacity:0.12;border-radius:50%;
  }
  .qtitle{
    display:flex;align-items:center;gap:8px;font-family:'Baloo Bhaijaan 2';font-weight:700;
    font-size:13.5px;color:var(--accent, var(--teal-dark));margin-bottom:10px;flex-wrap:wrap;
  }
  .qnum{
    display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;
    background:var(--accent, var(--teal));color:#fff;font-weight:900;font-size:15px;box-shadow:var(--shadow);
  }
  .qtag{font-size:10.5px;color:#fff;background:var(--accent, var(--teal));padding:2px 10px;border-radius:999px;opacity:0.85;}
  .qtext{
    background:#f8f4ea;border-radius:14px;padding:15px;font-size:18px;font-weight:900;line-height:1.7;
    margin-bottom:8px;border:2px dashed rgba(0,0,0,0.07);text-align:center;direction:ltr;
  }
  .qtext.ar{direction:rtl;font-size:15.5px;}
  .funny{font-size:12.5px;color:#8a7350;margin:0 0 16px;text-align:center;direction:rtl;}

  .hints{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .hint-btn{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:none;
    background:#fdf2ea;color:var(--ink);font-family:'Cairo';font-weight:700;font-size:13.5px;
    padding:11px 14px;border-radius:12px;cursor:pointer;transition:all .2s ease;text-align:right;
  }
  .hint-btn:active{transform:scale(0.98);}
  .hint-reveal{
    max-height:0;overflow:hidden;transition:max-height .35s ease, padding .35s ease;
    background:#eef7f6;border-radius:0 0 12px 12px;font-size:13.5px;line-height:1.8;padding:0 14px;
  }
  .hint-reveal.open{max-height:220px;padding:11px 14px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{
    display:flex;align-items:center;justify-content:space-between;border:2px solid #e9e1d2;background:#fffdf9;
    font-family:'Cairo';font-weight:700;font-size:15px;padding:13px 16px;border-radius:14px;cursor:pointer;
    transition:all .18s ease;
  }
  .opt-btn:hover{border-color:var(--accent, var(--teal));}
  .opt-btn .tag{font-size:17px;}
  .opt-btn.correct{background:#e8f8f1;border-color:var(--green);color:var(--green);}
  .opt-btn.wrong{background:#fdecea;border-color:var(--coral);color:#b6392e;}
  .opt-btn.disabled{pointer-events:none;opacity:0.85;}

  .opt-explain{
    display:none;font-size:13px;line-height:1.7;font-weight:600;
    background:#fff7ef;border-radius:0 0 12px 12px;padding:10px 14px;margin-top:-8px;margin-bottom:2px;
  }
  .opt-explain.show{display:block;}
  .opt-explain.ok{background:#eafaf3;color:#136b47;}
  .opt-explain.no{background:#fdeceb;color:#8f2e22;}

  .solution-box{
    display:none;margin-top:14px;background:#eef4fb;border-radius:14px;padding:14px 16px;
    font-size:14px;line-height:1.9;border:2px solid #d7e6f7;
  }
  .solution-box.show{display:block;}
  .solution-box .lbl{font-family:'Baloo Bhaijaan 2';font-weight:700;color:#2a5da0;margin-bottom:6px;display:block;}

  .result-card{
    text-align:center;background:linear-gradient(135deg, var(--teal), var(--purple));color:#fff;
    border-radius:22px;padding:26px 20px;box-shadow:var(--shadow);display:none;
  }
  .result-card.show{display:block;}
  .result-card h2{font-family:'Baloo Bhaijaan 2';font-size:22px;margin:0 0 8px;}
  .result-card p{margin:0;font-size:14.5px;opacity:0.95;}
  .result-card .emoji{font-size:40px;margin-bottom:6px;}

  .share-bar{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
  .share-btn{
    display:flex;align-items:center;gap:8px;border:none;padding:12px 18px;border-radius:14px;
    font-family:'Baloo Bhaijaan 2';font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow);
    text-decoration:none;color:#fff;
  }
  .wa{background:#25D366;}
  .rt{background:var(--sun);color:var(--ink);}

  footer{text-align:center;margin-top:18px;font-size:11.5px;color:#a9a094;}
</style>
</head>

const container = document.getElementById('cardsContainer');
const QCOUNT = QUESTIONS.length;
document.getElementById('scoreDisplay').textContent = '0 / ' + QCOUNT;

let score = 0;
let answered = {};

QUESTIONS.forEach((q, idx)=>{
  const n = idx + 1;
  const meta = TYPE_META[q.type];
  answered[n] = false;

  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card' + n;
  card.style.setProperty('--accent', meta.color);

  const opts = q.options.map((o,i)=>({...o, key:n+'-'+i}));

  let optsHtml = '';
  opts.forEach(o=>{
    optsHtml += `
      <button class="opt-btn" data-key="${o.key}" data-ok="${o.ok?'1':'0'}">
        <span>${o.v}</span><span class="tag"></span>
      </button>
      <div class="opt-explain ${o.ok?'ok':'no'}" id="ex-${o.key}">${o.ex}</div>`;
  });

  const qtextClass = q.isAr ? 'qtext ar' : 'qtext';

  card.innerHTML = `
    <div class="qtitle">
      <span class="qnum">${n}</span> السؤال ${n}
      <span class="qtag">${meta.emoji} ${meta.label}</span>
    </div>
    <div class="${qtextClass}">${q.text}</div>
    <div class="funny">${q.funny}</div>
    <div class="hints">
      <div>
        <button class="hint-btn" data-target="h${n}-1"><span>🔎 تلميح: أول خطوة</span><span>＋</span></button>
        <div class="hint-reveal" id="h${n}-1">${q.h1}</div>
      </div>
      <div>
        <button class="hint-btn" data-target="h${n}-2"><span>🎯 تلميح: كمّل الحل</span><span>＋</span></button>
        <div class="hint-reveal" id="h${n}-2">${q.h2}</div>
      </div>
    </div>
    <div class="options" id="opts${n}">${optsHtml}</div>
    <div class="solution-box" id="sol${n}">
      <span class="lbl">✅ الحل الكامل</span>${q.solution}
    </div>
  `;
  container.appendChild(card);
});

document.querySelectorAll('.hint-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const target = document.getElementById(btn.dataset.target);
    target.classList.toggle('open');
    const icon = btn.querySelector('span:last-child');
    icon.textContent = target.classList.contains('open') ? '－' : '＋';
  });
});

QUESTIONS.forEach((q, idx)=>{
  const n = idx + 1;
  const cont = document.getElementById('opts'+n);
  const buttons = cont.querySelectorAll('.opt-btn');
  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered[n]) return;
      answered[n] = true;
      const isOk = btn.dataset.ok === '1';
      buttons.forEach(b=>b.classList.add('disabled'));
      btn.classList.add(isOk ? 'correct' : 'wrong');
      btn.querySelector('.tag').textContent = isOk ? '✅' : '❌';
      document.getElementById('ex-'+btn.dataset.key).classList.add('show');
      document.getElementById('sol'+n).classList.add('show');
      if(isOk){ score++; }
      updateScore();
      checkFinish();
    });
  });
});

function updateScore(){
  document.getElementById('scoreDisplay').textContent = score + ' / ' + QCOUNT;
}

function checkFinish(){
  const allDone = Object.values(answered).every(v=>v===true);
  if(allDone){
    const rc = document.getElementById('resultCard');
    const title = document.getElementById('resultTitle');
    const text = document.getElementById('resultText');
    const emoji = document.getElementById('resultEmoji');
    rc.classList.add('show');
    rc.scrollIntoView({behavior:'smooth', block:'center'});

    if(score === QCOUNT){
      emoji.textContent = '🏆';
      title.textContent = 'خرافي! نتيجة كاملة';
      text.textContent = 'حليت الـ' + QCOUNT + ' سؤال كلهم صح 😎 صرت بطل بحيل الضرب والقسمة الذهنية';
    } else if(score >= QCOUNT*0.7){
      emoji.textContent = '💪';
      title.textContent = 'أداء ممتاز!';
      text.textContent = 'نتيجتك ' + score + ' من ' + QCOUNT + '، راجع الأسئلة اللي غلطت فيها وشوف الحل المكتوب تحتها';
    } else if(score >= QCOUNT*0.4){
      emoji.textContent = '🙂';
      title.textContent = 'بداية طيبة';
      text.textContent = 'نتيجتك ' + score + ' من ' + QCOUNT + '، راجع الحلول المكتوبة تحت كل سؤال غلطت فيه';
    } else {
      emoji.textContent = '🌱';
      title.textContent = 'وقت المراجعة';
      text.textContent = 'ولا يهمك، كل الحلول مكتوبة تحت كل سؤال، راجعها بهدوء وحاول مرة ثانية';
    }
  }
}

function restart(){
  score = 0;
  QUESTIONS.forEach((q, idx)=>{
    const n = idx + 1;
    answered[n] = false;
    const buttons = document.querySelectorAll('#opts'+n+' .opt-btn');
    buttons.forEach(b=>{
      b.classList.remove('correct','wrong','disabled');
      b.querySelector('.tag').textContent = '';
    });
    document.querySelectorAll('#opts'+n+' .opt-explain').forEach(e=>e.classList.remove('show'));
    document.getElementById('sol'+n).classList.remove('show');
  });
  updateScore();
  document.getElementById('resultCard').classList.remove('show');
  document.querySelectorAll('.hint-reveal.open').forEach(h=>h.classList.remove('open'));
  document.querySelectorAll('.hint-btn span:last-child').forEach(i=>i.textContent='＋');
  window.scrollTo({top:0, behavior:'smooth'});
}
