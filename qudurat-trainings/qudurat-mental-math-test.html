<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار شامل: فكّر أقل، حُلّ أسرع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Baloo+Bhaijaan+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --ink:#1F2A37; --soft:#5b6572; --card:#FFFFFF; --box:#f8f4ea; --boxLine:rgba(0,0,0,.08);
  --hint:#fdf2ea; --hintOpen:#eef7f6; --opt:#fffdf9; --optLine:#e9e1d2; --funny:#8a7350;
  --okBg:#e8f8f1; --ok:#1a9c6b; --okTxt:#136b47; --noBg:#fdecea; --no:#FF6B5E; --noTxt:#8f2e22;
  --solBg:#eef4fb; --solLine:#d7e6f7; --solTxt:#2a5da0; --teal:#0E8C86; --tealDark:#0A6B66; --purple:#8E6FD1;
  --shadow:0 10px 25px rgba(31,42,55,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A22; --ink:#ECEFF3; --soft:#A9B3BF; --card:#1E2632; --box:#26303D; --boxLine:rgba(255,255,255,.10);
    --hint:#2B2A2A; --hintOpen:#1F3433; --opt:#232C38; --optLine:#38434F; --funny:#D2B98E;
    --okBg:#173B2C; --okTxt:#8FE0B9; --noBg:#43201F; --noTxt:#F5A9A2;
    --solBg:#1D2B3D; --solLine:#2C4260; --solTxt:#9CC3F0; --tealDark:#5CC7C0; --shadow:0 10px 25px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141A22; --ink:#ECEFF3; --soft:#A9B3BF; --card:#1E2632; --box:#26303D; --boxLine:rgba(255,255,255,.10);
  --hint:#2B2A2A; --hintOpen:#1F3433; --opt:#232C38; --optLine:#38434F; --funny:#D2B98E;
  --okBg:#173B2C; --okTxt:#8FE0B9; --noBg:#43201F; --noTxt:#F5A9A2;
  --solBg:#1D2B3D; --solLine:#2C4260; --solTxt:#9CC3F0; --tealDark:#5CC7C0; --shadow:0 10px 25px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 12px 50px}
header{text-align:center;margin-bottom:12px}
.badge{display:inline-block;background:var(--teal);color:#fff;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;padding:7px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);transform:rotate(-2deg)}
h1{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;font-size:23px;margin:12px 0 4px;color:var(--tealDark)}
header p{margin:0;color:var(--soft);font-size:13.5px}
.groups{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;font-size:12px;font-weight:700}
.groups span{padding:5px 12px;border-radius:999px;color:#fff}
.score-bar{display:flex;align-items:center;gap:10px;margin:14px auto 20px;background:var(--card);border-radius:999px;padding:8px 18px;box-shadow:var(--shadow);font-weight:700;font-size:14px;width:fit-content;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:10}
.score-bar span{color:var(--purple)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;margin-bottom:22px;position:relative;overflow:hidden;border-top:5px solid var(--accent)}
.card::before{content:"";position:absolute;top:-40px;left:-40px;width:110px;height:110px;background:var(--accent);opacity:.12;border-radius:50%}
.qtitle{display:flex;align-items:center;gap:8px;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;font-size:14px;color:var(--accent);margin-bottom:10px;flex-wrap:wrap}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:15px}
.qtag{font-size:11px;color:#fff;background:var(--accent);padding:2px 10px;border-radius:999px}
.qgroup{font-size:11px;color:var(--soft);margin-inline-start:auto}
.qtext{background:var(--box);border-radius:14px;padding:15px;font-size:22px;font-weight:900;line-height:1.7;margin-bottom:8px;border:2px dashed var(--boxLine);text-align:center}
.funny{font-size:12.5px;color:var(--funny);margin:0 0 14px;text-align:center}
.hints{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.hint-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:none;background:var(--hint);color:var(--ink);font-family:inherit;font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:12px;cursor:pointer;text-align:right}
.hint-btn:focus-visible,.opt-btn:focus-visible,.share-btn:focus-visible{outline:3px solid #FFC23C;outline-offset:2px}
.hint-reveal{display:none;background:var(--hintOpen);border-radius:0 0 12px 12px;font-size:13.5px;line-height:1.8;padding:11px 14px}
.hint-reveal.open{display:block}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;align-items:center;gap:12px;border:2px solid var(--optLine);background:var(--opt);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;padding:12px 14px;border-radius:14px;cursor:pointer;text-align:right;width:100%}
.opt-btn:hover{border-color:var(--accent)}
.opt-btn .l{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px}
.opt-btn .v{flex:1}
.opt-btn .tag{font-size:17px}
.opt-btn.correct{background:var(--okBg);border-color:var(--ok);color:var(--okTxt)}
.opt-btn.wrong{background:var(--noBg);border-color:var(--no);color:var(--noTxt)}
.opt-btn:disabled{cursor:default}
.opt-explain{display:none;font-size:13px;line-height:1.7;font-weight:600;border-radius:0 0 12px 12px;padding:10px 14px;margin-top:-8px}
.opt-explain.show{display:block}
.opt-explain.ok{background:var(--okBg);color:var(--okTxt)}
.opt-explain.no{background:var(--noBg);color:var(--noTxt)}
.solution-box{display:none;margin-top:14px;background:var(--solBg);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.9;border:2px solid var(--solLine)}
.solution-box.show{display:block}
.solution-box .lbl{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;color:var(--solTxt);display:block;margin-bottom:4px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-size:.9em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.result-card{text-align:center;background:linear-gradient(135deg,#0E8C86,#8E6FD1);color:#fff;border-radius:22px;padding:26px 20px;box-shadow:var(--shadow);display:none}
.result-card.show{display:block}
.result-card h2{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-size:22px;margin:0 0 8px}
.result-card p{margin:0;font-size:14.5px}
.result-card .emoji{font-size:40px;margin-bottom:6px}
.share-bar{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.share-btn{display:flex;align-items:center;gap:8px;border:none;padding:12px 18px;border-radius:14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:#fff}
.wa{background:#25D366}.rt{background:#1F2A37}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">فكّر أقل ... حُلّ أسرع 🚀</span>
    <h1>الاختبار الشامل للحساب الذهني</h1>
    <p>جمع وطرح وضرب وقسمة... ١٠ أسئلة، كل سؤال بحيلة مختلفة ⚡</p>
  </header>
  <div class="groups">
    <span style="background:#0E8C86">➕➖ الجمع والطرح (١-٥)</span>
    <span style="background:#8E6FD1">✖️➗ الضرب والقسمة (٦-١٠)</span>
  </div>
  <div class="score-bar">🏆 نتيجتك: <span id="scoreDisplay">0 / 10</span></div>
  <div id="cards"></div>
  <div class="result-card" id="resultCard" aria-live="polite">
    <div class="emoji" id="rEmoji">🎉</div>
    <h2 id="rTitle"></h2>
    <p id="rText"></p>
  </div>
  <div class="share-bar">
    <a class="share-btn wa" id="waBtn" href="#" target="_blank" rel="noopener">📲 شارك التحدي بالواتساب</a>
    <button class="share-btn rt" onclick="restart()">🔄 حاول من جديد</button>
  </div>
  <footer>فكّر أقل ... حُلّ أسرع — الاختبار الشامل 🧠✨</footer>
</div>

<script>
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const Q=[
{c:"#0E8C86",g:"جمع وطرح",tag:"➗ تجزئة الجمع",text:"356 + 423",funny:"💬 فكّها مئات وعشرات وآحاد، وخلّ عقلك يشتغل 🧠",
 h1:"قسّم: (٣٠٠+٤٠٠)، (٥٠+٢٠)، (٦+٣)",h2:"اجمع كل فئة لحالها: ٧٠٠ و٧٠ و٩، وبعدين اجمعهم",
 sol:"٧٠٠ + ٧٠ + ٩ = ٧٧٩",
 o:[["779",1,"صح! ٧٠٠+٧٠+٩ = ٧٧٩ ✅"],["769","غلطت بالعشرات: ٥٠+٢٠ = ٧٠ مو ٦٠."],["789","زدت ١٠ بالعشرات، راجع ٥٠+٢٠."],["679","المئات غلط: ٣٠٠+٤٠٠ = ٧٠٠."]]},
{c:"#FF6B5E",g:"جمع وطرح",tag:"🔄 التعويض",text:"499 + 237",funny:"💬 الـ٤٩٩ تبي تصير ٥٠٠، خلها 😏",
 h1:"قرّب ٤٩٩ إلى ٥٠٠ (زدت ١)",h2:"اجمع ٥٠٠+٢٣٧، وبعدين اطرح الـ١ اللي زدته",
 sol:"٥٠٠ + ٢٣٧ = ٧٣٧ ← نطرح ١ = ٧٣٦",
 o:[["736",1,"صح! ٧٣٧ − ١ = ٧٣٦ ✅"],["737","نسيت تعوّض! لازم تطرح الـ١ اللي زدته."],["735","طرحت ٢ بدل ١، انتبه للفرق."],["746","غلطة بالجمع، راجع ٥٠٠+٢٣٧."]]},
{c:"#8E6FD1",g:"جمع وطرح",tag:"➖ تجزئة الطرح",text:"763 − 428",funny:"💬 الآحاد بتطلع سالبة بالنص، لا تخاف كمّل 😄",
 h1:"قسّم: (٧٠٠−٤٠٠)، (٦٠−٢٠)، (٣−٨)",h2:"النواتج: ٣٠٠ و٤٠ و(−٥)، اجمعها مع الانتباه للسالب",
 sol:"٣٠٠ + ٤٠ − ٥ = ٣٣٥",
 o:[["335",1,"صح! ٣٠٠+٤٠−٥ = ٣٣٥ ✅"],["345","جمعت الـ٥ بدل ما تطرحها، هي سالبة!"],["325","غلطة بالعشرات، ٦٠−٢٠ = ٤٠."],["365","راجع الحل خطوة خطوة."]]},
{c:"#D9739F",g:"جمع وطرح",tag:"🤝 التماثل",text:"36 + 47 + 64 + 53",funny:"💬 لا تجمع بالترتيب! دوّر على الأصحاب 👀",
 h1:"دوّر على زوجين مجموعهم رقم مستدير: (٣٦+٦٤) و(٤٧+٥٣)",h2:"كل زوج = ١٠٠، فاجمع ١٠٠+١٠٠",
 sol:"(٣٦+٦٤) + (٤٧+٥٣) = ١٠٠ + ١٠٠ = ٢٠٠",
 o:[["200",1,"صح! ١٠٠+١٠٠ = ٢٠٠ ✅"],["190","نقصت ١٠، راجع جمع الأزواج."],["210","زدت ١٠، راجع جمع الأزواج."],["180","ناتج غير مكتمل، راجع الحل."]]},
{c:"#1a9c6b",g:"جمع وطرح",tag:"🔟 العشرية",text:"18.4 − 6.75",funny:"💬 ضيف صفر عشان الفاصلات تصير صف واحد 🔟",
 h1:"اكتب ١٨٫٤ كـ ١٨٫٤٠ عشان تساوي الخانات مع ٦٫٧٥",h2:"اطرح عادي: ١٨٫٤٠ − ٦٫٧٥ وانتبه للاستلاف",
 sol:"١٨٫٤٠ − ٦٫٧٥ = ١١٫٦٥",
 o:[["11.65",1,"صح! ١٨٫٤٠ − ٦٫٧٥ = ١١٫٦٥ ✅"],["12.35","طرحت الصغير من الكبير بكل خانة بدل الاستلاف."],["12.65","نسيت الاستلاف من الآحاد."],["11.75","غلطة بالجزء العشري، راجع الحل."]]},
{c:"#0E8C86",g:"ضرب وقسمة",tag:"🔢 آحاد الضرب",text:"53 × 27",funny:"💬 ما تحتاج تضرب كامل، شوف آخر رقم بس 🔍",
 h1:"آحاد ٥٣ هو ٣، وآحاد ٢٧ هو ٧",h2:"٣ × ٧ = ٢١ ← الجواب لازم آخره ١",
 sol:"٣ × ٧ = ٢١ ← آخر رقم ١ ← الجواب ١٤٣١",
 o:[["1431",1,"صح! آخره ١ ويطابق ٣×٧ = ٢١ ✅"],["1430","آخره ٠، والمفروض ١."],["1433","آخره ٣، والمفروض ١."],["1426","آخره ٦، والمفروض ١."]]},
{c:"#8E6FD1",g:"ضرب وقسمة",tag:"⬛ فرق مربعين",text:"29 × 31",funny:"💬 الاثنين جيران الـ٣٠، استخدم السحر 😎",
 h1:"٢٩ = ٣٠ − ١ و ٣١ = ٣٠ + ١",h2:"(٣٠−١)(٣٠+١) = ٣٠² − ١²",
 sol:"٩٠٠ − ١ = ٨٩٩",
 o:[["899",1,"صح! ٩٠٠ − ١ = ٨٩٩ ✅"],["900","هذا ٣٠² بس، نسيت تطرح ١²."],["901","جمعت بدل ما تطرح."],["898","طرحت ٢ بدل ١."]]},
{c:"#3E7CB1",g:"ضرب وقسمة",tag:"1️⃣1️⃣ ضرب بـ١١",text:"76 × 11",funny:"💬 انتبه: المجموع هذي المرة أكبر من ١٠! 🔥",
 h1:"افصل الرقمين: ٧ (يسار) و٦ (يمين)، الوسط = ٧+٦ = ١٣",h2:"اكتب ٣ بالوسط واحمل ١ لليسار: ٧+١ = ٨",
 sol:"٨ | ٣ | ٦ ← ٨٣٦",
 o:[["836",1,"صح! ٧+٦ = ١٣، احمل ١: ٨٣٦ ✅"],["736","نسيت تحمل الـ١ لليسار."],["7136","حطيت ١٣ كاملة بالوسط! احمل الـ١."],["826","غلطة بالرقم الأوسط، ٧+٦ = ١٣."]]},
{c:"#D9739F",g:"ضرب وقسمة",tag:"٪ نسبة سريعة",text:"15% من 160",funny:"💬 ١٠٪ + نصها، وخلصت 😏",
 h1:"١٠٪ من ١٦٠ = ١٦",h2:"٥٪ = نص الـ١٠٪ = ٨ ← اجمع ١٦+٨",
 sol:"١٦ + ٨ = ٢٤",
 o:[["24",1,"صح! ١٦+٨ = ٢٤ ✅"],["16","هذا ١٠٪ بس، نسيت الـ٥٪."],["8","هذا ٥٪ بس."],["32","هذا ٢٠٪، مو ١٥٪."]]},
{c:"#A0714E",g:"ضرب وقسمة",tag:"🔟 قسمة عشرية",text:"7.2 ÷ 0.8",funny:"💬 آخر سؤال! اضرب الاثنين في ١٠ وتخلّص من الفاصلة 🎉",
 h1:"٧٫٢ × ١٠ = ٧٢ و ٠٫٨ × ١٠ = ٨",h2:"صارت قسمة عادية: ٧٢ ÷ ٨",
 sol:"٧٢ ÷ ٨ = ٩",
 o:[["9",1,"صح! ٧٢ ÷ ٨ = ٩ ✅"],["0.9","الفاصلة بمكان غلط، اضرب الاثنين في ١٠."],["90","ضربت واحد بس في ١٠."],["8","تحقق: ٨ × ٨ = ٦٤ مو ٧٢."]]}
];
const POS=[1,3,0,2,3,0,2,1,3,0];
const L=["أ","ب","ج","د"];
const box=document.getElementById("cards");
let score=0, done=0;

Q.forEach((q,i)=>{
  const n=i+1, right=q.o[0], wrongs=q.o.slice(1);
  const opts=[...wrongs]; opts.splice(POS[i],0,right);
  const card=document.createElement("section");
  card.className="card"; card.style.setProperty("--accent",q.c);
  card.innerHTML=`
    <div class="qtitle"><span class="qnum">${n}</span>السؤال ${n}<span class="qtag">${q.tag}</span><span class="qgroup">${q.g}</span></div>
    <div class="qtext"><span class="ltr">${q.text}</span></div>
    <div class="funny">${q.funny}</div>
    <div class="hints">
      <div><button class="hint-btn" aria-expanded="false"><span>🔎 تلميح: أول خطوة</span><span>＋</span></button><div class="hint-reveal">${q.h1}</div></div>
      <div><button class="hint-btn" aria-expanded="false"><span>🎯 تلميح: كمّل الحل</span><span>＋</span></button><div class="hint-reveal">${q.h2}</div></div>
    </div>
    <div class="options">${opts.map((o,k)=>`
      <button class="opt-btn" data-ok="${o[1]===1?1:0}"><span class="l">${L[k]}</span><span class="v"><span class="ltr">${o[0]}</span></span><span class="tag"></span></button>
      <div class="opt-explain ${o[1]===1?"ok":"no"}">${o[1]===1?o[2]:o[1]}</div>`).join("")}
    </div>
    <div class="solution-box"><span class="lbl">✅ الحل الكامل</span>${q.sol}</div>`;
  box.appendChild(card);

  card.querySelectorAll(".hint-btn").forEach(b=>b.onclick=()=>{
    const r=b.nextElementSibling, open=r.classList.toggle("open");
    b.lastElementChild.textContent=open?"－":"＋"; b.setAttribute("aria-expanded",open);
  });
  const btns=card.querySelectorAll(".opt-btn");
  btns.forEach(b=>b.onclick=()=>{
    if(card.dataset.done) return;
    card.dataset.done=1; done++;
    const ok=b.dataset.ok==="1";
    btns.forEach(x=>x.disabled=true);
    b.classList.add(ok?"correct":"wrong");
    b.querySelector(".tag").textContent=ok?"✅":"❌";
    if(!ok){const c=[...btns].find(x=>x.dataset.ok==="1"); c.classList.add("correct"); c.querySelector(".tag").textContent="✅";}
    b.nextElementSibling.classList.add("show");
    card.querySelector(".solution-box").classList.add("show");
    if(ok) score++;
    document.getElementById("scoreDisplay").textContent=`${score} / ${Q.length}`;
    if(done===Q.length) finish();
  });
});

function finish(){
  const rc=document.getElementById("resultCard"), e=document.getElementById("rEmoji"), t=document.getElementById("rTitle"), p=document.getElementById("rText");
  rc.classList.add("show");
  if(score===10){e.textContent="🏆";t.textContent="خرافي! عشرة من عشرة";p.textContent="جمع وطرح وضرب وقسمة كلها بعقلك 😎 صرت بطل الحساب الذهني";}
  else if(score>=7){e.textContent="💪";t.textContent="أداء ممتاز!";p.textContent=`نتيجتك ${score} من ١٠، شوف الحل تحت الأسئلة اللي غلطت فيها`;}
  else if(score>=4){e.textContent="🙂";t.textContent="بداية طيبة";p.textContent=`نتيجتك ${score} من ١٠، راجع الحيل اللي غلطت فيها وجرب مرة ثانية`;}
  else{e.textContent="🌱";t.textContent="وقت المراجعة";p.textContent="ولا يهمك، الحلول مكتوبة تحت كل سؤال، راجعها بهدوء وحاول من جديد";}
  rc.scrollIntoView({behavior:"smooth",block:"center"});
}

function restart(){
  score=0; done=0;
  document.getElementById("scoreDisplay").textContent="0 / "+Q.length;
  document.querySelectorAll(".card").forEach(c=>delete c.dataset.done);
  document.querySelectorAll(".opt-btn").forEach(b=>{b.disabled=false;b.classList.remove("correct","wrong");b.querySelector(".tag").textContent="";});
  document.querySelectorAll(".opt-explain,.solution-box").forEach(x=>x.classList.remove("show"));
  document.querySelectorAll(".hint-reveal").forEach(h=>h.classList.remove("open"));
  document.querySelectorAll(".hint-btn").forEach(b=>{b.lastElementChild.textContent="＋";b.setAttribute("aria-expanded","false");});
  document.getElementById("resultCard").classList.remove("show");
  window.scrollTo({top:0,behavior:"smooth"});
}

document.getElementById("waBtn").href="https://wa.me/?text="+encodeURIComponent(
`🧠 الاختبار الشامل: فكّر أقل ... حُلّ أسرع

١٠ أسئلة في الجمع والطرح ➕➖ والضرب والقسمة ✖️➗
كل سؤال بحيلة ذهنية مختلفة، تقدر تحلها كلها بدون ورقة وقلم؟ 😉

${location.href}`);
</script>
