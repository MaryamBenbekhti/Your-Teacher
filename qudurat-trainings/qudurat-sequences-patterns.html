<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تدريب المتتابعات والأنماط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Baloo+Bhaijaan+2:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --ink:#1F2A37; --soft:#5b6572; --card:#FFFFFF; --box:#f8f4ea; --boxLine:rgba(0,0,0,.08);
  --hint:#fdf2ea; --hintOpen:#eef7f6; --opt:#fffdf9; --optLine:#e9e1d2; --funny:#8a7350;
  --okBg:#e8f8f1; --ok:#1a9c6b; --okTxt:#136b47; --noBg:#fdecea; --no:#FF6B5E; --noTxt:#8f2e22;
  --solBg:#eef4fb; --solLine:#d7e6f7; --solTxt:#2a5da0; --teal:#0E8C86; --tealDark:#0A6B66; --purple:#8E6FD1;
  --shadow:0 10px 25px rgba(31,42,55,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A22; --ink:#ECEFF3; --soft:#A9B3BF; --card:#1E2632; --box:#26303D; --boxLine:rgba(255,255,255,.10);
    --hint:#2B2A2A; --hintOpen:#1F3433; --opt:#232C38; --optLine:#38434F; --funny:#D2B98E;
    --okBg:#173B2C; --okTxt:#8FE0B9; --noBg:#43201F; --noTxt:#F5A9A2;
    --solBg:#1D2B3D; --solLine:#2C4260; --solTxt:#9CC3F0; --tealDark:#5CC7C0; --shadow:0 10px 25px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141A22; --ink:#ECEFF3; --soft:#A9B3BF; --card:#1E2632; --box:#26303D; --boxLine:rgba(255,255,255,.10);
  --hint:#2B2A2A; --hintOpen:#1F3433; --opt:#232C38; --optLine:#38434F; --funny:#D2B98E;
  --okBg:#173B2C; --okTxt:#8FE0B9; --noBg:#43201F; --noTxt:#F5A9A2;
  --solBg:#1D2B3D; --solLine:#2C4260; --solTxt:#9CC3F0; --tealDark:#5CC7C0; --shadow:0 10px 25px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,'Segoe UI',sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 12px 50px}
header{text-align:center;margin-bottom:12px}
.badge{display:inline-block;background:var(--teal);color:#fff;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;padding:7px 18px;border-radius:999px;font-size:13.5px;box-shadow:var(--shadow);transform:rotate(-2deg)}
h1{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;font-size:23px;margin:12px 0 4px;color:var(--tealDark)}
header p{margin:0;color:var(--soft);font-size:13.5px}
.groups{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;font-size:12px;font-weight:700}
.groups span{padding:5px 12px;border-radius:999px;color:#fff}
.score-bar{display:flex;align-items:center;gap:10px;margin:14px auto 20px;background:var(--card);border-radius:999px;padding:8px 18px;box-shadow:var(--shadow);font-weight:700;font-size:14px;width:fit-content;position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:10}
.score-bar span{color:var(--purple)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:20px 18px;margin-bottom:22px;position:relative;overflow:hidden;border-top:5px solid var(--accent)}
.card::before{content:"";position:absolute;top:-40px;left:-40px;width:110px;height:110px;background:var(--accent);opacity:.12;border-radius:50%}
.qtitle{display:flex;align-items:center;gap:8px;font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;font-size:14px;color:var(--accent);margin-bottom:10px;flex-wrap:wrap}
.qnum{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:15px}
.qtag{font-size:11px;color:#fff;background:var(--accent);padding:2px 10px;border-radius:999px}
.qgroup{font-size:11px;color:var(--soft);margin-inline-start:auto}
.qtext{background:var(--box);border-radius:14px;padding:15px;font-size:22px;font-weight:900;line-height:1.7;margin-bottom:8px;border:2px dashed var(--boxLine);text-align:center}
.funny{font-size:12.5px;color:var(--funny);margin:0 0 14px;text-align:center}
.hints{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.hint-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:none;background:var(--hint);color:var(--ink);font-family:inherit;font-weight:700;font-size:13.5px;padding:11px 14px;border-radius:12px;cursor:pointer;text-align:right}
.hint-btn:focus-visible,.opt-btn:focus-visible,.share-btn:focus-visible{outline:3px solid #FFC23C;outline-offset:2px}
.hint-reveal{display:none;background:var(--hintOpen);border-radius:0 0 12px 12px;font-size:13.5px;line-height:1.8;padding:11px 14px}
.hint-reveal.open{display:block}
.options{display:flex;flex-direction:column;gap:10px}
.opt-btn{display:flex;align-items:center;gap:12px;border:2px solid var(--optLine);background:var(--opt);color:var(--ink);font-family:inherit;font-weight:700;font-size:16px;padding:12px 14px;border-radius:14px;cursor:pointer;text-align:right;width:100%}
.opt-btn:hover{border-color:var(--accent)}
.opt-btn .l{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px}
.opt-btn .v{flex:1}
.opt-btn .tag{font-size:17px}
.opt-btn.correct{background:var(--okBg);border-color:var(--ok);color:var(--okTxt)}
.opt-btn.wrong{background:var(--noBg);border-color:var(--no);color:var(--noTxt)}
.opt-btn:disabled{cursor:default}
.opt-explain{display:none;font-size:13px;line-height:1.7;font-weight:600;border-radius:0 0 12px 12px;padding:10px 14px;margin-top:-8px}
.opt-explain.show{display:block}
.opt-explain.ok{background:var(--okBg);color:var(--okTxt)}
.opt-explain.no{background:var(--noBg);color:var(--noTxt)}
.solution-box{display:none;margin-top:14px;background:var(--solBg);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.9;border:2px solid var(--solLine)}
.solution-box.show{display:block}
.solution-box .lbl{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;color:var(--solTxt);display:block;margin-bottom:4px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-size:.9em}
.fr>span:first-child{border-bottom:2px solid currentColor;padding:0 3px}
.result-card{text-align:center;background:linear-gradient(135deg,#0E8C86,#8E6FD1);color:#fff;border-radius:22px;padding:26px 20px;box-shadow:var(--shadow);display:none}
.result-card.show{display:block}
.result-card h2{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-size:22px;margin:0 0 8px}
.result-card p{margin:0;font-size:14.5px}
.result-card .emoji{font-size:40px;margin-bottom:6px}
.share-bar{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.share-btn{display:flex;align-items:center;gap:8px;border:none;padding:12px 18px;border-radius:14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;color:#fff}
.wa{background:#25D366}.rt{background:#1F2A37}
footer{text-align:center;color:var(--soft);font-size:12px;margin-top:24px}

.legend{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.legend a{font-size:11.5px;font-weight:700;color:#fff;text-decoration:none;padding:5px 11px;border-radius:999px}
.legend a:focus-visible{outline:3px solid #FFC23C;outline-offset:2px}
.sec{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif;font-weight:700;font-size:17px;color:#fff;padding:8px 16px;border-radius:14px;margin:28px 0 14px;text-align:center;scroll-margin-top:70px}
.qtext{font-size:19px;font-weight:800;text-align:right;line-height:2}
.opt-btn .v{font-size:17px;line-height:1.9}
sup{font-size:.62em;line-height:0;vertical-align:.85em;color:#C2410C;font-weight:800}
.fr{font-size:.85em;margin:0 2px}
.done-count{color:var(--soft)!important;font-weight:600}
</style>
</head>

<div class="wrap">
  <header>
    <span class="badge">فكّر أقل ... حُلّ أسرع 🚀</span>
    <h1>تدريب المتتابعات والأنماط</h1>

const box=document.getElementById("cards"), legend=document.getElementById("legend");
let score=0, done=0, wrongSec={}, last=null;

    last=q.s;
    const s=document.createElement("div"); s.className="sec"; s.id="sec-"+q.s; s.style.background=color; s.textContent=`${emo} ${label}`; box.appendChild(s);

  });
});
function finish(){
  const rc=document.getElementById("resultCard"), e=document.getElementById("rEmoji"), t=document.getElementById("rTitle"), p=document.getElementById("rText");
  const s=ar(score);
  const weak=Object.entries(wrongSec).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>SEC[k][0]);
  const tip=weak.length?` راجع: ${weak.join("، ")}`:"";
  if(score===50){e.textContent="🏆";t.textContent="أسطوري! ٥٠ من ٥٠";p.textContent="ولا غلطة! صرت تشوف النمط قبل لا يكمل 😎";}
  else if(score>=40){e.textContent="🔥";t.textContent="ممتاز جدًا!";p.textContent=`نتيجتك ${s} من ٥٠.`+tip;}
  else if(score>=30){e.textContent="💪";t.textContent="شغل حلو!";p.textContent=`نتيجتك ${s} من ٥٠.`+tip;}
  else if(score>=15){e.textContent="🙂";t.textContent="بداية طيبة";p.textContent=`نتيجتك ${s} من ٥٠.`+tip;}
  else{e.textContent="🌱";t.textContent="وقت المراجعة";p.textContent="ولا يهمك، كل خبير بدأ من هنا."+tip;}
  rc.classList.add("show");
  rc.scrollIntoView({behavior:"smooth",block:"center"});
}
function restart(){
  score=0; done=0; wrongSec={};
  document.getElementById("scoreDisplay").textContent="٠ من ٥٠";
  document.getElementById("doneDisplay").textContent="· ٠ مجاوب";
  document.querySelectorAll(".card").forEach(c=>delete c.dataset.done);
  document.querySelectorAll(".opt-btn").forEach(b=>{b.disabled=false;b.classList.remove("correct","wrong");b.querySelector(".tag").textContent="";});
  document.querySelectorAll(".opt-explain,.solution-box").forEach(x=>x.classList.remove("show"));
  document.querySelectorAll(".hint-reveal").forEach(h=>h.classList.remove("open"));
  document.querySelectorAll(".hint-btn").forEach(b=>{b.lastElementChild.textContent="＋";b.setAttribute("aria-expanded","false");});
  document.getElementById("resultCard").classList.remove("show");
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("waBtn").href="https://wa.me/?text="+encodeURIComponent(`🔢 تدريب المتتابعات والأنماط: فكّر أقل ... حُلّ أسرع

٥٠ سؤال بأسلوب القياس: الحسابية ومجموعها، طريقة غاوس، الهندسية، اكتشاف النمط، والدوريات
كم بتجيب من ٥٠؟ 😉

${location.href}`);
