/* Ready-made training (from the original HTML file), restyled with the site's colours.
   Everything is scoped to .ready-training so it can't affect the rest of the site. */
.ready-training{
  --bg:#F7F3EE; --card:#FFFFFF; --ink:#1A1A1A; --muted:#6B6158; --line:#E6DCD1;
  --accent:#C78255; --accent-ink:#FFFFFF; --sun:#1A1A1A; --sun-ink:#FFFFFF;
  --ok:#2E7D32; --okbg:#E3F4E6; --bad:#C62828; --badbg:#FBE6E4; --chip:rgba(199,130,85,0.12);
  color:var(--ink); font-size:19px; line-height:1.7; direction:rtl;
}
.ready-training *{box-sizing:border-box}
.ready-training .wrap{max-width:680px;margin:0 auto;padding-block:10px 20px}
.ready-training h1,.ready-training h2{line-height:1.3;text-wrap:balance;margin:0;font-weight:800}
.ready-training button{font:inherit;color:inherit;cursor:pointer}
.ready-training button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ready-training .m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-weight:700;white-space:nowrap}
.ready-training .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin-inline:4px;font-weight:700}
.ready-training .fr span:first-child{border-bottom:2px solid currentColor;padding-inline:4px}
.ready-training .box{display:inline-block;width:1.1em;height:1.1em;background:var(--line);border-radius:4px;vertical-align:-0.15em;border:2px dashed var(--muted)}
.ready-training u{text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--bad)}

.ready-training .home{display:flex;flex-direction:column;gap:22px;padding-top:10px}
.ready-training .tag{display:inline-block;background:var(--chip);color:var(--accent);font-size:15px;font-weight:700;padding:4px 14px;border-radius:99px;align-self:flex-start}
.ready-training .home h1{font-size:40px}
.ready-training .home p{margin:0;color:var(--muted)}
.ready-training .big{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:26px 24px;border:none;border-radius:var(--radius);text-align:right;font-size:30px;font-weight:800;transition:0.3s}
.ready-training .big:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(0,0,0,0.12)}
.ready-training .big small{display:block;font-size:16px;font-weight:600;opacity:.85}
.ready-training .big .arrow{font-size:34px}
.ready-training .b1{background:var(--accent);color:var(--accent-ink)}
.ready-training .b2{background:var(--sun);color:var(--sun-ink)}
.ready-training .big:active{transform:scale(.98)}
.ready-training .foot{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}

.ready-training .top{position:sticky;top:79px;z-index:5;background:var(--bg);padding-block:10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.ready-training .back{border:1px solid var(--line);background:var(--card);border-radius:50px;padding:6px 16px;font-size:16px;font-weight:700}
.ready-training .prog{flex:1;min-width:0}
.ready-training .prog .lbl{font-size:15px;color:var(--muted);font-weight:600}
.ready-training .bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.ready-training .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s}
.ready-training .qhead{margin-block:18px 6px}
.ready-training .qhead h2{font-size:28px}
.ready-training .list{display:flex;flex-direction:column;gap:16px}
.ready-training .q{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.ready-training .qt{display:flex;gap:10px;align-items:flex-start;font-size:20px;font-weight:700}
.ready-training .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;font-weight:800;font-size:17px;margin-top:2px}
.ready-training .qtext{min-width:0}
.ready-training .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ready-training .opt{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 12px;background:var(--bg);border:2px solid transparent;border-radius:15px;text-align:right;font-size:20px;font-weight:600}
.ready-training .opt .k{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);background:var(--card);color:var(--ink);display:grid;place-items:center;font-size:14px;font-weight:800}
.ready-training .opt:hover:not(:disabled){border-color:var(--accent)}
.ready-training .opt:disabled{cursor:default}
.ready-training .opt.right{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.ready-training .opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.ready-training .opt.dim{opacity:.55}
.ready-training .fb{margin-top:12px;padding:10px 14px;border-radius:12px;font-size:17px}
.ready-training .fb.ok{background:var(--okbg);color:var(--ok);font-weight:700}
.ready-training .fb.no{background:var(--badbg);color:var(--ink)}
.ready-training .fb.no b{color:var(--bad)}
.ready-training table.t{border-collapse:collapse;margin-top:10px;font-size:17px}
.ready-training table.t th,.ready-training table.t td{border:1px solid var(--line);padding:4px 14px;text-align:center}
.ready-training table.t th{background:var(--chip)}

.ready-training .res{margin-top:22px;background:var(--card);border:2px solid var(--accent);border-radius:var(--radius);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ready-training .score{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
.ready-training .score span{font-size:30px;color:var(--muted)}
.ready-training .res p{margin:0}
.ready-training .miss{font-size:16px;color:var(--muted)}
.ready-training .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.ready-training .btn{border:none;border-radius:50px;padding:12px 24px;font-size:18px;font-weight:700}
.ready-training .btn.main{background:var(--accent);color:var(--accent-ink)}
.ready-training .btn.alt{background:var(--text-dark);color:white}
.ready-training .pending{text-align:center;color:var(--muted);font-size:16px;margin-top:18px}
@media (max-width:768px){.ready-training .top{top:0}}
@media (max-width:420px){.ready-training .opts{grid-template-columns:1fr}.ready-training .home h1{font-size:34px}.ready-training{font-size:18px}}
@media (prefers-reduced-motion:reduce){.ready-training *{transition:none!important}}
  </style>
</head>

const AR='٠١٢٣٤٥٦٧٨٩';
const ar = s => String(s); // secondary: English digits
const KEYS=['أ','ب','ج','د'];
const CHEERS=['صح عليك!','ممتاز!','بطل!','كفو!','أحسنت!'];
const app=document.getElementById('app');
let cur=null, answers=[];

function home(){
  cur=null;
  app.innerHTML=`<div class="home">
    <span class="tag">أحياء 1 · أول ثانوي</span>
    <h1>اختبار الأحياء</h1>
    <p>40 سؤالًا: طبيعة العلم، خصائص المخلوقات الحية، التصنيف.</p>
    <button class="big b1" id="go-today"><span>ابدأ الاختبار<small>40 سؤالًا</small></span><span class="arrow">←</span></button>
    <p class="foot">مدرّبتك | يلا نبسطها</p>
  </div>`;

function start(key){
  cur=key; const Q=QUIZ[key]; answers=new Array(Q.qs.length).fill(null);
  let h=`<div class="top"><button class="back" id="back">الرئيسية</button>
    <div class="prog"><div class="lbl" id="lbl"></div><div class="bar"><i id="barf"></i></div></div></div>
    <div class="qhead"><h2>${Q.name}</h2></div><div class="list">`;
  Q.qs.forEach((q,i)=>{
    h+=`<div class="q" id="q-${key}-${ar(i)}"><div class="qt"><span class="num">${ar(i+1)}</span><div class="qtext">${ar(q.q)}</div></div>
      <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-q="${i}" data-o="${j}"><span class="k">${KEYS[j]}</span><span>${ar(o)}</span></button>`).join('')}</div>
      <div class="fbslot"></div></div>`;
  });
  h+=`</div><div id="end"></div>`;
  app.innerHTML=h;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.q,+b.dataset.o,b));
  update(); window.scrollTo(0,0);
}

function pick(i,j,btn){
  if(answers[i]!==null) return;
  const q=QUIZ[cur].qs[i]; answers[i]=j;
  const card=btn.closest('.q'); const opts=card.querySelectorAll('.opt');
  opts.forEach((b,k)=>{b.disabled=true; if(k===q.a) b.classList.add('right'); else if(k===j) b.classList.add('wrong'); else b.classList.add('dim');});
  const fb=card.querySelector('.fbslot');
  fb.innerHTML = j===q.a
    ? `<div class="fb ok">${CHEERS[i%CHEERS.length]}</div>`
    : `<div class="fb no"><b>الإجابة الصحيحة: ${ar(q.o[q.a])}</b><br>${ar(q.e)}</div>`;
  update();
}

function update(){
  const n=answers.filter(x=>x!==null).length, t=answers.length;
  document.getElementById('lbl').textContent=`أجبت ${ar(n)} من ${ar(t)}`;
  document.getElementById('barf').style.width=(n/t*100)+'%';
  const end=document.getElementById('end');
  if(n<t){ end.innerHTML=`<p class="pending">النتيجة تظهر هنا بعد ما تجاوب على كل الأسئلة</p>`; return; }
  const qs=QUIZ[cur].qs; const score=answers.filter((x,i)=>x===qs[i].a).length;
  const wrong=answers.map((x,i)=>x===qs[i].a?null:ar(i+1)).filter(Boolean);
  let msg = score===t?'علامة كاملة! حتى الخلايا تصفّق لك'
          : score>=t-4?'قريب جدًا من الكمال، راجع أخطاءك وتصير '+t
          : score>=Math.ceil(t/2)?'شغل حلو، ينقصك شوي مراجعة بس'
          : 'ولا يهمك، أعد الاختبار وبتشوف الفرق';
  end.innerHTML=`<div class="res"><div>نتيجتك</div>
    <div class="score">${ar(score)} <span>/ ${ar(t)}</span></div>
    <p>${ar(msg)}</p>
    ${wrong.length?`<p class="miss">راجع الأسئلة: ${wrong.join(' ، ')}</p>`:''}
    <div class="actions"><button class="btn main" id="again">أعد الاختبار</button><button class="btn alt" id="home2">الرئيسية</button></div></div>`;
  document.getElementById('again').onclick=()=>start(cur);
  document.getElementById('home2').onclick=home;
  end.scrollIntoView({behavior:'smooth',block:'center'});
}
home();
</script>
</body>
</html>
